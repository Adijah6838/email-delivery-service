services:
  postgres:
    image: postgres:15
    container_name: email_postgres
    environment:
      POSTGRES_USER: email_user
      POSTGRES_PASSWORD: email_password
      POSTGRES_DB: email_db
    ports:
      - "5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: email_redis
    ports:
      - "6390:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: